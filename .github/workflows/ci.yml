name: ci

on:
  push:
  pull_request:

jobs:
  semgrep_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version Semgrep
        run: docker run --rm semgrep/semgrep:latest semgrep --version
      - name: Scan Semgrep
        run: docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:latest semgrep scan --config tekbook-rules.yml --metrics=off --json --output semgrep-report.json .
      - name: Rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
