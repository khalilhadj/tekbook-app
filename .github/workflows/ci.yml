name: CI
on: [push]

jobs:
  compile:
    runs-on: ubuntu-latest
    container: maven:3.9-eclipse-temurin-21
    steps:
      - uses: actions/checkout@v4
      - run: mvn -B package -DskipTests
      - run: ls -lh target/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/*.jar
          retention-days: 7

  package-check:
    runs-on: ubuntu-latest
    needs: compile
    container: maven:3.9-eclipse-temurin-21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: target
      - run: ls -lh target/*.jar
