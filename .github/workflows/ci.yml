name: CI
on: [push]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B package -DskipTests
      - run: ls -lh target/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/*.jar
          retention-days: 7

  unit-tests:
    runs-on: ubuntu-latest
    needs: compile
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tekbook
          POSTGRES_USER: tekbook
          POSTGRES_PASSWORD: Dem0-Lab-Only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tekbook -d tekbook"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/tekbook
      SPRING_DATASOURCE_USERNAME: tekbook
      SPRING_DATASOURCE_PASSWORD: Dem0-Lab-Only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test

  package-check:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: target
      - run: ls -lh target/*.jar

  build-image:
    runs-on: ubuntu-latest
    needs: [unit-tests, package-check, semgrep_scan]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build et push
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          TAG=${GITHUB_SHA::8}
          docker build -t $IMAGE:$TAG .
          docker push $IMAGE:$TAG

 

  semgrep_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version Semgrep
        run: docker run --rm semgrep/semgrep:latest semgrep --version
      - name: Scan Semgrep
        run: docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:latest semgrep scan --config tekbook-rules.yml --error --metrics=off --json --output semgrep-report.json .
      - name: Rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

  deploy_staging:
    runs-on: ubuntu-latest
    needs: [semgrep_scan, build-image]
    steps:
      - uses: actions/checkout@v4
      - name: Déployer staging
        run: echo "Remplacer par le déploiement réel du staging puis attendre la disponibilité"

  dast_baseline:
    runs-on: ubuntu-latest
    needs: deploy_staging
    steps:
      - name: Vérifier STAGING_URL
        run: test -n "${{ vars.STAGING_URL }}"
      - name: ZAP baseline
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          docker run --rm -v "$PWD/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "${{ vars.STAGING_URL }}" -r zap-baseline.html
      - name: Rapport ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline
          path: zap-out/zap-baseline.html
          retention-days: 7
