name: CI
on: [push]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B package -DskipTests
      - run: ls -lh target/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/*.jar
          retention-days: 7

  unit-tests:
    runs-on: ubuntu-latest
    needs: compile
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tekbook
          POSTGRES_USER: tekbook
          POSTGRES_PASSWORD: Dem0-Lab-Only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tekbook -d tekbook"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/tekbook
      SPRING_DATASOURCE_USERNAME: tekbook
      SPRING_DATASOURCE_PASSWORD: Dem0-Lab-Only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test

  package-check:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: target
      - run: ls -lh target/*.jar

  build-image:
    runs-on: ubuntu-latest
    needs: [unit-tests, package-check]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build et push
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          TAG=${GITHUB_SHA::8}
          docker build -t $IMAGE:$TAG .
          docker push $IMAGE:$TAG

    leak-demo:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "1 direct : $DEMO_TOKEN"
          echo "2 base64 inverse : $(echo -n "$DEMO_TOKEN" | rev | base64)"
          echo "3 caracteres : $(echo -n "$DEMO_TOKEN" | fold -w1 | tr '\n' ' ')"
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
